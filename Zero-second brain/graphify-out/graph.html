<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABACOOS v2 - Software Architecture Diagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"
    integrity="sha384-Ux6phic9PEHJ38YtrijhkzyJ8yQlH8i/+buBR8s3mAZOJrP1gwyvAcIYl3GWtpX1"
    crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090d16;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #graph-wrapper {
      flex: 1;
      position: relative;
      height: 100vh;
      background-color: #090d16;
      background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    #graph {
      width: 100%;
      height: 100%;
    }

    /* Floating View Controls */
    #view-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #111827;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 5;
    }

    .ctrl-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      background: #374151;
      color: #ffffff;
      border-color: #4b5563;
    }

    .ctrl-divider {
      width: 1px;
      height: 18px;
      background: #374151;
      margin: 0 4px;
    }

    /* Sidebar Component Details Inspector */
    #sidebar {
      width: 350px;
      background: #0f172a;
      border-left: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    #header-title {
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #header-title h2 {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #header-title .badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    #search-wrap {
      padding: 14px 20px;
      border-bottom: 1px solid #1e293b;
      position: relative;
    }

    #search {
      width: 100%;
      background: #090d16;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 12px 8px 34px;
      border-radius: 6px;
      font-size: 12.5px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.15s ease;
    }

    #search-wrap::before {
      content: '🔍';
      position: absolute;
      left: 30px;
      top: 22px;
      font-size: 12px;
      opacity: 0.4;
    }

    #search:focus {
      border-color: #3b82f6;
    }

    #search-results {
      max-height: 180px;
      overflow-y: auto;
      margin-top: 8px;
      padding: 4px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      display: none;
    }

    .search-item {
      padding: 7px 10px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #cbd5e1;
    }

    .search-item:hover {
      background: #1e293b;
      color: #ffffff;
    }

    #info-panel {
      padding: 16px 20px;
      border-bottom: 1px solid #1e293b;
      min-height: 160px;
    }

    #info-panel h3 {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #info-content {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    #info-content .info-card {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 14px;
    }

    #info-content .title {
      font-weight: 600;
      color: #f8fafc;
      font-size: 13.5px;
      margin-bottom: 10px;
    }

    #info-content .field {
      margin-bottom: 7px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #info-content .field b {
      color: #64748b;
      font-weight: 500;
    }

    #info-content .code-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    #info-content .pill {
      background: #1e293b;
      color: #cbd5e1;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }

    #info-content .empty {
      color: #475569;
      font-style: italic;
      font-size: 12px;
    }

    .neighbor-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      border-left: 3px solid #334155;
      background: #090d16;
      transition: all 0.15s ease;
    }

    .neighbor-link:hover {
      background: #1e293b;
    }

    #neighbors-list {
      max-height: 140px;
      overflow-y: auto;
      margin-top: 6px;
    }

    #legend-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    #legend-wrap h3 {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 2px;
      transition: background 0.15s ease;
    }

    .legend-item:hover {
      background: #1e293b;
    }

    .legend-item.dimmed {
      opacity: 0.3;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .legend-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #e2e8f0;
    }

    .legend-count {
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    #stats {
      padding: 12px 20px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      background: #090d16;
    }

    #legend-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    #legend-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: #64748b;
      user-select: none;
      font-weight: 500;
    }

    #legend-controls label:hover {
      color: #f8fafc;
    }

    .legend-cb,
    #select-all-cb {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid #334155;
      border-radius: 3px;
      background: #090d16;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .legend-cb:checked,
    #select-all-cb:checked {
      background: #3b82f6;
      border-color: #3b82f6;
    }

    .legend-cb:checked::after,
    #select-all-cb:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 7px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <div id="graph-wrapper">
    <div id="graph"></div>
    <div id="view-controls">
      <button class="ctrl-btn" onclick="zoomIn()" title="Zoom In">+</button>
      <button class="ctrl-btn" onclick="zoomOut()" title="Zoom Out">&minus;</button>
      <div class="ctrl-divider"></div>
      <button class="ctrl-btn" onclick="fitView()" title="Fit Architecture">Fit Architecture</button>
      <button class="ctrl-btn" onclick="resetView()" title="Reset View">Reset Layout</button>
    </div>
  </div>

  <div id="sidebar">
    <div id="header-title">
      <h2>Architecture Inspector</h2>
      <span class="badge">ABACOOS v2</span>
    </div>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search architecture components..." autocomplete="off">
      <div id="search-results"></div>
    </div>
    <div id="info-panel">
      <h3>Component Details</h3>
      <div id="info-content"><span class="empty">Select a component node to view details</span></div>
    </div>
    <div id="legend-wrap">
      <h3>System Modules</h3>
      <div id="legend-controls">
        <label><input type="checkbox" id="select-all-cb" checked onchange="toggleAllCommunities(!this.checked)">Select All</label>
      </div>
      <div id="legend"></div>
    </div>
    <div id="stats">14 NODES &middot; 9 EDGES &middot; 7 MODULES</div>
  </div>

  <script>
    // PRESERVED ALL 14 RAW NODES WITH EXACT METADATA & HIERARCHICAL LAYOUT POSITIONS
    const RAW_NODES = [
      { "id": "index", "title": "Application Entry Point", "sublabel": "index.php", "type": "ENTRY", "color": { "background": "#111827", "border": "#ef4444", "highlight": { "background": "#1f2937", "border": "#fca5a5" } }, "community": 2, "community_name": "Application Entry Point", "source_file": "index.php", "file_type": "code", "degree": 2, "x": -160, "y": -370 },
      { "id": "include_template", "title": "Main View Wrapper", "sublabel": "include/template.php", "type": "LAYOUT", "color": { "background": "#111827", "border": "#ef4444", "highlight": { "background": "#1f2937", "border": "#fca5a5" } }, "community": 2, "community_name": "Application Entry Point", "source_file": "include/template.php", "file_type": "code", "degree": 1, "x": 160, "y": -370 },

      { "id": "login", "title": "Login Handler", "sublabel": "login.php", "type": "AUTH", "color": { "background": "#111827", "border": "#f59e0b", "highlight": { "background": "#1f2937", "border": "#fef08a" } }, "community": 1, "community_name": "Core Infrastructure & Auth", "source_file": "login.php", "file_type": "code", "degree": 1, "x": -160, "y": -230 },
      { "id": "sign_up", "title": "Registration Handler", "sublabel": "sign-up.php", "type": "AUTH", "color": { "background": "#111827", "border": "#f59e0b", "highlight": { "background": "#1f2937", "border": "#fef08a" } }, "community": 1, "community_name": "Core Infrastructure & Auth", "source_file": "sign-up.php", "file_type": "code", "degree": 1, "x": 160, "y": -230 },

      { "id": "include_functions", "title": "Core Business Logic", "sublabel": "include/functions.php", "type": "CORE", "color": { "background": "#111827", "border": "#10b981", "highlight": { "background": "#1f2937", "border": "#a7f3d0" } }, "community": 1, "community_name": "Core Infrastructure & Auth", "source_file": "include/functions.php", "file_type": "code", "degree": 4, "x": 0, "y": -90 },

      { "id": "account_process", "title": "Account API Controller", "sublabel": "account/process.php", "type": "API", "color": { "background": "#111827", "border": "#3b82f6", "highlight": { "background": "#1f2937", "border": "#bfdbfe" } }, "community": 0, "community_name": "Account & Transaction APIs", "source_file": "account/process.php", "file_type": "code", "degree": 2, "x": -280, "y": 50 },
      { "id": "transaction_process", "title": "Transaction API Controller", "sublabel": "transaction/process.php", "type": "API", "color": { "background": "#111827", "border": "#3b82f6", "highlight": { "background": "#1f2937", "border": "#bfdbfe" } }, "community": 0, "community_name": "Account & Transaction APIs", "source_file": "transaction/process.php", "file_type": "code", "degree": 2, "x": 0, "y": 50 },
      { "id": "category_process", "title": "Category API Controller", "sublabel": "category/process.php", "type": "API", "color": { "background": "#111827", "border": "#10b981", "highlight": { "background": "#1f2937", "border": "#a7f3d0" } }, "community": 4, "community_name": "Category API Controller", "source_file": "category/process.php", "file_type": "code", "degree": 0, "x": 280, "y": 50 },

      { "id": "sub_account_process", "title": "Sub-Account API Controller", "sublabel": "sub-account/process.php", "type": "API", "color": { "background": "#111827", "border": "#eab308", "highlight": { "background": "#1f2937", "border": "#fef08a" } }, "community": 5, "community_name": "Sub-Account API Controller", "source_file": "sub-account/process.php", "file_type": "code", "degree": 0, "x": -280, "y": 140 },
      { "id": "user_process", "title": "User & Invitation Controller", "sublabel": "user/process.php", "type": "API", "color": { "background": "#111827", "border": "#a855f7", "highlight": { "background": "#1f2937", "border": "#f3e8ff" } }, "community": 6, "community_name": "User & Invitation Controller", "source_file": "user/process.php", "file_type": "code", "degree": 0, "x": 0, "y": 140 },
      { "id": "activity_log_process", "title": "Activity Log Processor", "sublabel": "activity-log/process.php", "type": "API", "color": { "background": "#111827", "border": "#06b6d4", "highlight": { "background": "#1f2937", "border": "#cffaff" } }, "community": 3, "community_name": "Activity Log Processor", "source_file": "activity-log/process.php", "file_type": "code", "degree": 0, "x": 280, "y": 140 },

      { "id": "action_based_routing", "title": "Action-Based Routing Pattern", "sublabel": "API & Data Connections.md", "type": "CONCEPT", "color": { "background": "#111827", "border": "#3b82f6", "highlight": { "background": "#1f2937", "border": "#bfdbfe" } }, "community": 0, "community_name": "Account & Transaction APIs", "source_file": "API & Data Connections.md", "file_type": "concept", "degree": 2, "x": -160, "y": 230 },
      { "id": "tenant_isolation", "title": "Multi-Tenant Data Isolation", "sublabel": "API & Data Connections.md", "type": "CONCEPT", "color": { "background": "#111827", "border": "#3b82f6", "highlight": { "background": "#1f2937", "border": "#bfdbfe" } }, "community": 0, "community_name": "Account & Transaction APIs", "source_file": "API & Data Connections.md", "file_type": "concept", "degree": 2, "x": 160, "y": 230 },

      { "id": "global_library_database", "title": "Database Connection & Infrastructure", "sublabel": "global-library/database.php", "type": "DATABASE", "color": { "background": "#111827", "border": "#8b5cf6", "highlight": { "background": "#1f2937", "border": "#ddd6fe" } }, "community": 1, "community_name": "Core Infrastructure & Auth", "source_file": "global-library/database.php", "file_type": "code", "degree": 1, "x": 0, "y": 370 }
    ];

    // PRESERVED ALL 9 RAW RELATIONSHIPS
    const RAW_EDGES = [
      { "from": "account_process", "to": "action_based_routing", "label": "implements", "title": "implements [EXTRACTED]", "dashes": false, "width": 1.5, "color": { "color": "#3b82f6", "opacity": 0.8 }, "confidence": "EXTRACTED" },
      { "from": "account_process", "to": "tenant_isolation", "label": "implements", "title": "implements [INFERRED]", "dashes": true, "width": 1.5, "color": { "color": "#60a5fa", "opacity": 0.5 }, "confidence": "INFERRED" },
      { "from": "transaction_process", "to": "action_based_routing", "label": "implements", "title": "implements [EXTRACTED]", "dashes": false, "width": 1.5, "color": { "color": "#3b82f6", "opacity": 0.8 }, "confidence": "EXTRACTED" },
      { "from": "transaction_process", "to": "tenant_isolation", "label": "implements", "title": "implements [INFERRED]", "dashes": true, "width": 1.5, "color": { "color": "#60a5fa", "opacity": 0.5 }, "confidence": "INFERRED" },
      { "from": "include_functions", "to": "global_library_database", "label": "references", "title": "references [EXTRACTED]", "dashes": false, "width": 2, "color": { "color": "#10b981", "opacity": 0.8 }, "confidence": "EXTRACTED" },
      { "from": "index", "to": "include_functions", "label": "calls", "title": "calls [EXTRACTED]", "dashes": false, "width": 2, "color": { "color": "#ef4444", "opacity": 0.8 }, "confidence": "EXTRACTED" },
      { "from": "login", "to": "include_functions", "label": "calls", "title": "calls [EXTRACTED]", "dashes": false, "width": 2, "color": { "color": "#f59e0b", "opacity": 0.8 }, "confidence": "EXTRACTED" },
      { "from": "sign_up", "to": "include_functions", "label": "calls", "title": "calls [EXTRACTED]", "dashes": false, "width": 2, "color": { "color": "#f59e0b", "opacity": 0.8 }, "confidence": "EXTRACTED" },
      { "from": "index", "to": "include_template", "label": "references", "title": "references [EXTRACTED]", "dashes": false, "width": 2, "color": { "color": "#ef4444", "opacity": 0.8 }, "confidence": "EXTRACTED" }
    ];

    const LEGEND = [
      { "cid": 0, "color": "#3b82f6", "label": "Account & Transaction APIs", "count": 4 },
      { "cid": 1, "color": "#f59e0b", "label": "Core Infrastructure & Auth", "count": 4 },
      { "cid": 2, "color": "#ef4444", "label": "Application Entry Point", "count": 2 },
      { "cid": 3, "color": "#06b6d4", "label": "Activity Log Processor", "count": 1 },
      { "cid": 4, "color": "#10b981", "label": "Category API Controller", "count": 1 },
      { "cid": 5, "color": "#eab308", "label": "Sub-Account API Controller", "count": 1 },
      { "cid": 6, "color": "#a855f7", "label": "User & Invitation Controller", "count": 1 }
    ];

    // Clean Architecture Rectangular Containers
    const ARCH_LAYERS = [
      { "step": "01", "title": "PRESENTATION LAYER", "x": -450, "y": -420, "width": 900, "height": 95, "color": "rgba(239, 68, 68, 0.04)", "border": "rgba(239, 68, 68, 0.2)" },
      { "step": "02", "title": "APPLICATION & AUTHENTICATION LAYER", "x": -450, "y": -280, "width": 900, "height": 95, "color": "rgba(245, 158, 11, 0.04)", "border": "rgba(245, 158, 11, 0.2)" },
      { "step": "03", "title": "BUSINESS LOGIC LAYER", "x": -450, "y": -140, "width": 900, "height": 95, "color": "rgba(16, 185, 129, 0.04)", "border": "rgba(16, 185, 129, 0.2)" },
      { "step": "04", "title": "API CONTROLLERS & ACTION ROUTERS", "x": -450, "y": 0, "width": 900, "height": 280, "color": "rgba(59, 130, 246, 0.04)", "border": "rgba(59, 130, 246, 0.2)" },
      { "step": "05", "title": "PERSISTENCE & DATABASE LAYER", "x": -450, "y": 320, "width": 900, "height": 95, "color": "rgba(139, 92, 246, 0.04)", "border": "rgba(139, 92, 246, 0.2)" }
    ];

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Node dataset with clean multi-line label: Title\nFilepath
    // Rendered natively by vis-network for 100% accurate node size & click hit-testing!
    const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
      id: n.id,
      label: `${n.title}\n${n.sublabel}`,
      shape: 'box',
      shapeProperties: { borderRadius: 6 },
      margin: { top: 12, bottom: 12, left: 16, right: 16 },
      borderWidth: 1.5,
      borderWidthSelected: 2.5,
      widthConstraint: { minimum: 220, maximum: 260 },
      x: n.x,
      y: n.y,
      color: {
        background: '#111827',
        border: n.color.border,
        highlight: n.color.highlight,
        hover: { background: '#1f2937', border: n.color.border }
      },
      font: { color: '#f8fafc', face: 'Inter, sans-serif', size: 12, align: 'center' },
      title: n.title,
      _community: n.community,
      _community_name: n.community_name,
      _source_file: n.source_file,
      _file_type: n.file_type,
      _degree: n.degree,
      _type: n.type,
      _sublabel: n.sublabel
    })));

    const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
      id: i,
      from: e.from,
      to: e.to,
      label: '',
      title: e.title,
      dashes: e.dashes,
      width: e.width,
      color: e.color,
      arrows: { to: { enabled: true, scaleFactor: 0.5 } },
      smooth: { type: 'cubicBezier', forceDirection: 'vertical', roundness: 0.4 }
    })));

    const container = document.getElementById('graph');
    const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
      physics: { enabled: false },
      interaction: {
        hover: true,
        selectable: true,
        selectConnectedEdges: false,
        tooltipDelay: 100,
        hideEdgesOnDrag: false,
        zoomView: true,
        dragView: true
      },
      edges: { selectionWidth: 2.5 },
    });

    // Helper function to draw rounded container rectangles on canvas
    function drawRoundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // Draw Architecture Containers on Canvas
    network.on('beforeDrawing', function (ctx) {
      ARCH_LAYERS.forEach(layer => {
        ctx.save();
        ctx.fillStyle = layer.color;
        ctx.strokeStyle = layer.border;
        ctx.lineWidth = 1;
        drawRoundRect(ctx, layer.x, layer.y, layer.width, layer.height, 6);
        ctx.fill();
        ctx.stroke();

        // Step Label & Layer Title Header
        ctx.fillStyle = '#64748b';
        ctx.font = '600 10px JetBrains Mono, monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`${layer.step} // ${layer.title}`, layer.x + 16, layer.y + 20);
        ctx.restore();
      });
    });

    // View Control Buttons
    function zoomIn() {
      network.moveTo({ scale: network.getScale() * 1.25, animation: { duration: 200, easingFunction: 'easeInOutQuad' } });
    }

    function zoomOut() {
      network.moveTo({ scale: network.getScale() * 0.8, animation: { duration: 200, easingFunction: 'easeInOutQuad' } });
    }

    function fitView() {
      network.fit({ animation: { duration: 300, easingFunction: 'easeInOutQuad' } });
    }

    function resetView() {
      network.moveTo({ position: { x: 0, y: -20 }, scale: 0.9, animation: { duration: 300, easingFunction: 'easeInOutQuad' } });
    }

    // Auto-fit & center on initial load
    network.once('afterDrawing', () => {
      fitView();
    });

    // Component Inspection Details Renderer
    function showInfo(nodeId) {
      const n = RAW_NODES.find(rn => rn.id === nodeId);
      if (!n) return;
      const neighborIds = network.getConnectedNodes(nodeId);
      const neighborItems = neighborIds.map(nid => {
        const nb = RAW_NODES.find(rn => rn.id === nid);
        const color = nb ? nb.color.border : '#555';
        return `<span class="neighbor-link" style="border-left-color:${esc(color)}" data-nid="${esc(nid)}"><span>${esc(nb ? nb.title : nid)}</span><span class="pill" style="font-size:10px">${esc(nb ? nb.type || '' : '')}</span></span>`;
      }).join('');

      document.getElementById('info-content').innerHTML = `
        <div class="info-card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span class="pill" style="color:#38bdf8;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.3);font-family:JetBrains Mono,monospace;font-size:10px">${esc(n.type || 'MODULE')}</span>
            <span style="font-size:11px;color:#64748b;font-family:JetBrains Mono">${n.degree} connections</span>
          </div>
          <div class="title">${esc(n.title)}</div>
          <div class="field"><b>Source Path:</b> <span class="code-path">${esc(n.source_file || '-')}</span></div>
          <div class="field"><b>File Type:</b> <span class="pill">${esc(n.file_type || 'code')}</span></div>
          <div class="field"><b>Module Cluster:</b> <span style="color:#cbd5e1">${esc(n.community_name)}</span></div>
          ${neighborIds.length ? `
            <div style="margin-top:14px;color:#64748b;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.06em">Connected Components (${neighborIds.length})</div>
            <div id="neighbors-list">${neighborItems}</div>
          ` : ''}
        </div>
      `;
    }

    function focusNode(nodeId) {
      network.focus(nodeId, { scale: 1.3, animation: { duration: 300, easingFunction: 'easeInOutQuad' } });
      network.selectNodes([nodeId]);
      showInfo(nodeId);
      highlightConnections(nodeId);
    }

    function highlightConnections(nodeId) {
      if (!nodeId) {
        nodesDS.update(RAW_NODES.map(n => ({ id: n.id, opacity: 1.0 })));
        return;
      }
      const connectedNodeIds = new Set(network.getConnectedNodes(nodeId));
      connectedNodeIds.add(nodeId);

      nodesDS.update(RAW_NODES.map(n => ({
        id: n.id,
        opacity: connectedNodeIds.has(n.id) ? 1.0 : 0.25
      })));
    }

    document.addEventListener('click', e => {
      const el = e.target.closest('.neighbor-link');
      if (el && el.dataset.nid !== undefined) focusNode(el.dataset.nid);
    });

    let hoveredNodeId = null;
    network.on('hoverNode', params => {
      hoveredNodeId = params.node;
      container.style.cursor = 'pointer';
      highlightConnections(params.node);
    });

    network.on('blurNode', () => {
      hoveredNodeId = null;
      container.style.cursor = 'default';
      if (network.getSelectedNodes().length === 0) {
        highlightConnections(null);
      }
    });

    network.on('selectNode', params => {
      if (params.nodes.length > 0) {
        showInfo(params.nodes[0]);
        highlightConnections(params.nodes[0]);
      }
    });

    network.on('click', params => {
      if (params.nodes.length > 0) {
        showInfo(params.nodes[0]);
        highlightConnections(params.nodes[0]);
      } else {
        document.getElementById('info-content').innerHTML = '<span class="empty">Select a component node to view details</span>';
        highlightConnections(null);
      }
    });

    const searchInput = document.getElementById('search');
    const searchResults = document.getElementById('search-results');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase().trim();
      searchResults.innerHTML = '';
      if (!q) { searchResults.style.display = 'none'; return; }
      const matches = RAW_NODES.filter(n => n.title.toLowerCase().includes(q) || (n.source_file && n.source_file.toLowerCase().includes(q))).slice(0, 20);
      if (!matches.length) { searchResults.style.display = 'none'; return; }
      searchResults.style.display = 'block';
      matches.forEach(n => {
        const el = document.createElement('div');
        el.className = 'search-item';
        el.textContent = n.title;
        el.style.borderLeft = `3px solid ${n.color.border}`;
        el.onclick = () => {
          focusNode(n.id);
          searchResults.style.display = 'none';
          searchInput.value = '';
        };
        searchResults.appendChild(el);
      });
    });

    document.addEventListener('click', e => {
      if (!searchResults.contains(e.target) && e.target !== searchInput)
        searchResults.style.display = 'none';
    });

    const hiddenCommunities = new Set();
    const selectAllCb = document.getElementById('select-all-cb');

    function updateSelectAllState() {
      const total = LEGEND.length;
      const hidden = hiddenCommunities.size;
      selectAllCb.checked = hidden === 0;
      selectAllCb.indeterminate = hidden > 0 && hidden < total;
    }

    function toggleAllCommunities(hide) {
      document.querySelectorAll('.legend-item').forEach(item => {
        hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
      });
      document.querySelectorAll('.legend-cb').forEach(cb => {
        cb.checked = !hide;
      });
      LEGEND.forEach(c => {
        if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
      });
      const updates = RAW_NODES.map(n => ({ id: n.id, hidden: hide }));
      nodesDS.update(updates);
      updateSelectAllState();
    }

    const legendEl = document.getElementById('legend');
    LEGEND.forEach(c => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'legend-cb';
      cb.checked = true;
      cb.addEventListener('change', (e) => {
        e.stopPropagation();
        if (cb.checked) {
          hiddenCommunities.delete(c.cid);
          item.classList.remove('dimmed');
        } else {
          hiddenCommunities.add(c.cid);
          item.classList.add('dimmed');
        }
        const updates = RAW_NODES
          .filter(n => n.community === c.cid)
          .map(n => ({ id: n.id, hidden: !cb.checked }));
        nodesDS.update(updates);
        updateSelectAllState();
      });
      item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>
        <span class="legend-label">${c.label}</span>
        <span class="legend-count">${c.count}</span>`;
      item.prepend(cb);
      item.onclick = (e) => {
        if (e.target === cb) return;
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event('change'));
      };
      legendEl.appendChild(item);
    });
  </script>
</body>

</html>
